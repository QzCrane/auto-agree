name: Bootstrap v8 classless parser hotfix

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-classless-parser-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8-hotfix/classless-parser.patch.b64; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Verify and apply exact hotfix
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-v8-hotfix/classless-parser.patch.b64 > /tmp/classless.patch
          echo 'a03732a7c5e8b249bd3203aa5592980ec139a533852a696648879cbf37d89a51  /tmp/classless.patch' | sha256sum --check --strict
          git apply --check /tmp/classless.patch
          git apply /tmp/classless.patch
          rm -rf .bootstrap-v8-hotfix
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified hotfix
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'fix: defer one-shot classless click until parser completion'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
