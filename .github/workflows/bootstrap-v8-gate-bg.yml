name: Bootstrap v8 Gate background recomposition

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-gate-bg
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Rewrite Gate sibling-evidence path to background scope transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/gate.js')
          s = p.read_text()
          fn = s.index('  function onMutations(records) {')
          old_marker = '    const rescannedScopes = new WeakSet();\n'
          if s.count(old_marker, fn) != 1:
              raise SystemExit(f'expected one rescannedScopes marker after onMutations, found {s.count(old_marker, fn)}')
          s = s[:fn] + s[fn:].replace(old_marker, '', 1)
          fn = s.index('  function onMutations(records) {')
          start = s.index('          const node = nodes[i];', fn)
          end_marker = "\n        }\n      } else if (record.type === 'characterData') {"
          end = s.index(end_marker, start)
          old = s[start:end]
          if 'scanEvidence(scope' not in old or 'rescannedScopes' not in old:
              raise SystemExit('unexpected Gate mutation block; refusing rewrite')
          new = '''          const node = nodes[i];
          const remaining = Math.min(0.35, Math.max(0.12, SYNC_MUTATION_BUDGET_MS - (performance.now() - start)));
          const hit = inspectNode(node, true, remaining);
          if (hit) return activate(`mutation-${hit.reason || 'evidence'}`, hit.seed || node);

          // Parser/framework commits can add credentials, a classless legal row, and the
          // proceed action as sibling subtrees. Queue only their common local UI scope; the
          // existing lifecycle-aware deep scheduler deduplicates and composes evidence outside
          // the MutationObserver microtask, without any document-wide rescan.
          const el = node instanceof Element ? node : node?.parentElement;
          if (!(el instanceof Element)) continue;
          const nf = node.nodeType === Node.TEXT_NODE ? textFlags(node.data || '') : elementFlags(el);
          if (!(nf & (F.AUTH | F.CREDENTIAL | F.LEGAL | F.ASSENT | F.REQUIRED))) continue;
          const scope = localScope(el);
          if (scope instanceof Element && scope !== el) queueDeep(scope, true);'''
          p.write_text(s[:start] + new + s[end:])
          PY
          rm -rf .bootstrap-v8-gate-bg
          rm -f .bootstrap-v8-gate-bg-trigger
          node --check extension/gate.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified Gate fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/gate.js .bootstrap-v8-gate-bg-trigger .bootstrap-v8-gate-bg 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: recompose classless sibling evidence off mutation microtask'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
