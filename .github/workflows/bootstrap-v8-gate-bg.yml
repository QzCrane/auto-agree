name: Bootstrap v8 Gate background recomposition

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-gate-bg
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8-gate-bg/gate-bg.patch.b64; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply exact Gate background-scope patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-v8-gate-bg/gate-bg.patch.b64 > /tmp/gate-bg.patch
          echo '017fe89fab30f852ba74981ec54b30d9e23715391d2de0d50c956b4cc2c5a49a  /tmp/gate-bg.patch' | sha256sum --check --strict
          git apply --check /tmp/gate-bg.patch
          git apply /tmp/gate-bg.patch
          rm -rf .bootstrap-v8-gate-bg
          node --check extension/gate.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified Gate fix
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/gate.js
          git commit -m 'fix: recompose classless sibling evidence off mutation microtask'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
