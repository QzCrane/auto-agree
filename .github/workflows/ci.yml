name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-rootbatch:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact lossless RootBatch overflow patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('extension/engine.js')
          s = p.read_text()
          old = '''  function enqueueRootBatch(roots, index, urgent) {
            if (!roots || index >= roots.length) return;
            while (rootBatches.length >= MAX_ROOT_BATCHES) rootBatches.shift();
            const refs = roots.map(root => root && typeof root === 'object' ? new WeakRef(root) : null);
            rootBatches.push({ refs, index, urgent, createdAt: performance.now() });
            scheduleBackground();
          }
          '''
          new = '''  function sharedRootBatchParent(roots, index) {
            let parent = null;
            for (let i = index; i < roots.length; i++) {
              const root = roots[i];
              if (!root || !rootConnected(root)) continue;
              const next = root instanceof ShadowRoot ? root : root.parentNode;
              if (!next || !rootConnected(next)) continue;
              if (!parent) parent = next;
              else if (parent !== next) return null;
            }
            return parent;
          }

          function appendRootBatchRefs(job, roots, index) {
            for (let i = index; i < roots.length; i++) {
              const root = roots[i];
              if (root && typeof root === 'object') job.refs.push(new WeakRef(root));
            }
          }

          function enqueueRootBatch(roots, index, urgent) {
            if (!roots || index >= roots.length) return;
            if (rootBatches.length >= MAX_ROOT_BATCHES) {
              // DOM discovery is state-based, so sibling overflow can be losslessly coalesced to
              // their live parent instead of discarding an older batch. The parent then enters the
              // normal generation/time-sliced root path and observes the final subtree state after
              // the burst settles. This preserves the hard batch-object cap without silent FN.
              const parent = sharedRootBatchParent(roots, index);
              if (parent) {
                queueRoot(parent, urgent);
                return;
              }
              // Mixed-root overflow cannot always be coarsened without jumping to document-wide
              // scanning. Preserve losslessness with weak refs in the newest bounded batch; this
              // does not retain detached DOM and avoids making global rescans an attacker-triggered
              // overflow primitive.
              const tail = rootBatches[rootBatches.length - 1];
              appendRootBatchRefs(tail, roots, index);
              tail.urgent = tail.urgent || urgent;
              tail.createdAt = performance.now();
              scheduleBackground();
              return;
            }
            const refs = [];
            for (let i = index; i < roots.length; i++) {
              const root = roots[i];
              if (root && typeof root === 'object') refs.push(new WeakRef(root));
            }
            if (!refs.length) return;
            rootBatches.push({ refs, index: 0, urgent, createdAt: performance.now() });
            scheduleBackground();
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'exact enqueueRootBatch source mismatch: {s.count(old)} matches')
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/engine.js
          git diff --cached --check
          git commit -m "fix: coalesce root-batch overflow without dropping discovery"
          git push origin HEAD:${{ github.head_ref }}

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer test tool
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.1.0
      - name: Install Chrome for Testing explicitly
        run: npx puppeteer browsers install chrome
      - name: Inspect managed Chrome for Testing
        run: |
          CHROME="$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")"
          echo "$CHROME"
          "$CHROME" --version
      - name: Ensure virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --help >/dev/null
      - name: Run real headed unpacked-extension behavior E2E and profile
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-extension.mjs --profile
      - name: Prove cooperative stale-world generation revocation
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-generation-lease.mjs
      - name: Run release update transition against PR base
        if: github.event_name == 'pull_request'
        env:
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-update.mjs
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi