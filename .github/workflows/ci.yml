name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer test tool
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.1.0
      - name: Inspect system Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          (google-chrome --version || google-chrome-stable --version || chromium --version)
      - name: Run real unpacked-extension E2E and profile
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/e2e-extension.mjs --profile
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi
