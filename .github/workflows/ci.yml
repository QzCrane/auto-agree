name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-rootbatch-live-ttl:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v11-engine-rootbatch-ttl-fix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v11-engine-rootbatch-ttl-fix
          fetch-depth: 0
      - name: Apply live RootBatch TTL repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('extension/engine.js')
          s = p.read_text()
          old = "    if (performance.now() - job.createdAt > ROOT_BATCH_TTL_MS) return false;\n"
          new = "    if (performance.now() - job.createdAt > ROOT_BATCH_TTL_MS) job.createdAt = performance.now();\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one RootBatch TTL drop, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check extension/engine.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit production patch only
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- extension/engine.js)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/engine.js
          git commit -m 'fix: preserve live Engine RootBatch across TTL age'
          git push origin HEAD:agent/v11-engine-rootbatch-ttl-fix

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer test tool
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.1.0
      - name: Install Chrome for Testing explicitly
        run: npx puppeteer browsers install chrome
      - name: Inspect managed Chrome for Testing
        run: |
          CHROME="$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")"
          echo "$CHROME"
          "$CHROME" --version
      - name: Ensure virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --help >/dev/null
      - name: Run real headed unpacked-extension behavior E2E and profile
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-extension.mjs --profile
      - name: Saturate Probe and Gate bounded discovery queues
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-tier-overflow.mjs
      - name: Prove live Gate deep cursor survives TTL age
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-gate-live-ttl.mjs
      - name: Saturate Engine walk queue
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-overflow.mjs
      - name: Prove live Engine RootBatch survives TTL age
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-rootbatch-ttl.mjs
      - name: Prove cooperative stale-world generation revocation
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-generation-lease.mjs
      - name: Run release update transition against PR base
        if: github.event_name == 'pull_request'
        env:
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-update.mjs
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi
