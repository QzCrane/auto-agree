name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer + Chrome for Testing
        run: npm install --no-save --no-package-lock puppeteer@25.1.0
      - name: Inspect managed Chrome for Testing
        run: |
          node -e "import('puppeteer').then(p=>console.log(p.default.executablePath()))"
          "$(node -e "import('puppeteer').then(p=>process.stdout.write(p.default.executablePath()))")" --version
      - name: Run real unpacked-extension E2E and profile
        env:
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/e2e-extension.mjs --profile
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi
