name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-v11-version:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v11.0.0' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v11.0.0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply coherent v11 generation bump
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = '10.0.0'
          new = '11.0.0'
          runtime = [
              'extension/bootstrap.js',
              'extension/engine.js',
              'extension/gate.js',
              'extension/generation-lease.js',
              'extension/handover-guard.js',
              'extension/risk-core.js',
              'extension/semantic-core.js',
              'extension/worker.js',
          ]
          for name in runtime:
              p = Path(name)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one {old} sentinel, found {count}')
              p.write_text(s.replace(old, new, 1))

          for name in ['extension/manifest.json', 'package.json']:
              p = Path(name)
              s = p.read_text()
              needle = f'"version": "{old}"'
              if s.count(needle) != 1:
                  raise SystemExit(f'{name}: expected exactly one version field {needle}')
              p.write_text(s.replace(needle, f'"version": "{new}"', 1))
          PY
          for file in extension/*.js; do node --check "$file"; done
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit v11 runtime generation
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- extension package.json)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/bootstrap.js extension/engine.js extension/gate.js extension/generation-lease.js extension/handover-guard.js extension/risk-core.js extension/semantic-core.js extension/worker.js extension/manifest.json package.json
          git commit -m 'release: bump runtime generation to v11.0.0'
          git push origin HEAD:release/v11.0.0

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer test tool
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.1.0
      - name: Install Chrome for Testing explicitly
        run: npx puppeteer browsers install chrome
      - name: Inspect managed Chrome for Testing
        run: |
          CHROME="$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")"
          echo "$CHROME"
          "$CHROME" --version
      - name: Ensure virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --help >/dev/null
      - name: Run real headed unpacked-extension behavior E2E and profile
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-extension.mjs --profile
      - name: Saturate Probe and Gate bounded discovery queues
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-tier-overflow.mjs
      - name: Prove live Gate deep cursor survives TTL age
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-gate-live-ttl.mjs
      - name: Saturate Engine walk queue
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-overflow.mjs
      - name: Prove live Engine RootBatch survives TTL age
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-rootbatch-ttl.mjs
      - name: Prove live Engine sibling batch survives TTL age
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-batch-ttl.mjs
      - name: Saturate Engine broad closed-shadow queue
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-engine-shadow-overflow.mjs
      - name: Prove rejected Engine authorization has zero DOM effect
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-authorize-rejection.mjs
      - name: Prove cooperative stale-world generation revocation
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-generation-lease.mjs
      - name: Run release update transition against PR base
        if: github.event_name == 'pull_request'
        env:
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-update.mjs
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi
