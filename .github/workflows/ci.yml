name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v10-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v10-handover-convergence' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build adversarial v10 candidate
        run: python .v10-bootstrap.py
      - name: Verify deterministic candidate before commit
        run: |
          npm test
          python tools/package_extension.py --check
      - name: Commit generated red-test candidate
        run: |
          rm .v10-bootstrap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .v10-bootstrap.py extension package.json tests
          git diff --cached --check
          git commit -m "test: expose v9 handover locality gaps"
          git push origin HEAD:${{ github.head_ref }}

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: python tools/package_extension.py --check

  unpacked-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned Puppeteer test tool
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer@25.1.0
      - name: Install Chrome for Testing explicitly
        run: npx puppeteer browsers install chrome
      - name: Inspect managed Chrome for Testing
        run: |
          CHROME="$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")"
          echo "$CHROME"
          "$CHROME" --version
      - name: Ensure virtual display
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --help >/dev/null
      - name: Run real headed unpacked-extension behavior E2E and profile
        env:
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-extension.mjs --profile
      - name: Run release update transition against PR base
        if: github.event_name == 'pull_request'
        env:
          AUTO_AGREE_PREVIOUS_REF: ${{ github.event.pull_request.base.sha }}
          AUTO_AGREE_HEADED: '1'
        run: xvfb-run -a node tests/e2e-update.mjs
      - name: Print E2E profile evidence
        if: always()
        run: |
          if test -f artifacts/e2e-profile.json; then cat artifacts/e2e-profile.json; fi