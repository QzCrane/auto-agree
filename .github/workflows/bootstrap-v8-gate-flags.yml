name: Bootstrap v8 Gate evidence-flag reuse

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-gate-flags
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Reuse Gate scan flags for local-scope scheduling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/gate.js')
          s = p.read_text()
          fn = s.index('  function onMutations(records) {')
          start = s.index('          const node = nodes[i];', fn)
          end_marker = "\n        }\n      } else if (record.type === 'characterData') {"
          end = s.index(end_marker, start)
          old = s[start:end]
          if 'queueDeep(scope, true)' not in old or 'inspectNode(node' not in old:
              raise SystemExit('unexpected onMutations block; refusing rewrite')
          new = '''          const node = nodes[i];
          const remaining = Math.min(0.35, Math.max(0.12, SYNC_MUTATION_BUDGET_MS - (performance.now() - start)));
          const result = scanEvidence(node, 64, remaining, true);
          if (result.hit) return activate(`mutation-${result.reason || 'evidence'}`, result.seed || node);
          if (result.truncated) queueDeep(node, true);

          // Reuse the bounded scan we already paid for. A classless legal row keeps LEGAL/ASSENT
          // in descendant text rather than the row's own attributes; discarding result.flags made
          // such sibling evidence invisible to the local-scope transaction.
          const el = node instanceof Element ? node : node?.parentElement;
          if (!(el instanceof Element)) continue;
          const nf = result.flags | (node.nodeType === Node.TEXT_NODE ? textFlags(node.data || '') : elementFlags(el));
          if (!(nf & (F.AUTH | F.CREDENTIAL | F.LEGAL | F.ASSENT | F.REQUIRED))) continue;
          const scope = localScope(el);
          if (scope instanceof Element && scope !== el) queueDeep(scope, true);'''
          p.write_text(s[:start] + new + s[end:])
          PY
          node --check extension/gate.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified Gate evidence fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/gate.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve classless descendant evidence for Gate scheduling'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
