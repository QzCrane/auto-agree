name: Bootstrap v8 row diagnostic

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-row-diagnostic
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8-row-diagnostic/row-diagnostic.patch.b64; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply exact row diagnostic
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-v8-row-diagnostic/row-diagnostic.patch.b64 > /tmp/row-diagnostic.patch
          echo 'a75e121c98104cd0e231e9be0995f8457e8bd9187af0d70a7f59b40049ee1811  /tmp/row-diagnostic.patch' | sha256sum --check --strict
          git apply --check /tmp/row-diagnostic.patch
          git apply /tmp/row-diagnostic.patch
          rm -rf .bootstrap-v8-row-diagnostic
          node --check tests/e2e-extension.mjs
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit row diagnostic
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'test: capture classless row target evidence'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
