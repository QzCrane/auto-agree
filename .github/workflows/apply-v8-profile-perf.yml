name: Apply v8 profile-driven probe optimization

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v8-profile-perf
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply and verify exact optimization
        shell: bash
        run: |
          set -euo pipefail
          echo '4f74bcbebae95735636246bbfe2b5e995cd53dc26163567a4aed5afcf317c844  .v8perf/bootstrap-text-driven.patch' | sha256sum --check --strict
          git apply --check .v8perf/bootstrap-text-driven.patch
          git apply .v8perf/bootstrap-text-driven.patch
          node --check extension/bootstrap.js
          npm test
          python tools/package_extension.py --check
      - name: Commit production optimization only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/bootstrap.js
          git diff --cached --check
          git commit -m 'perf: make probe legal-text driven on checkbox-heavy pages'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
