name: sync-final-engine-evidence

on:
  push:
    branches: [agent/restore-activation-recall]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-activation-recall
      - name: Synchronize final package hash and gate count
        run: |
          python - <<'PY'
          from pathlib import Path
          old_hash='1478d808e277f6c687f719bc7185ff1398b4f6199450f988eda4b03ad3d4b601'
          new_hash='fe4fe1221509c09a1d4071686e689a679603e829e702056325d327a743199c7b'
          for name in ['README.md','docs/testing.md','docs/security-model.md','docs/verification/v12.2.md']:
              p=Path(name); text=p.read_text(encoding='utf-8')
              assert text.count(old_hash)==1, (name,text.count(old_hash))
              p.write_text(text.replace(old_hash,new_hash),encoding='utf-8')
          p=Path('docs/testing.md'); text=p.read_text(encoding='utf-8')
          old='The current deterministic suite auto-discovers **29 gates**.'
          new='The current deterministic suite auto-discovers **30 gates**.'
          assert text.count(old)==1
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' README.md docs/security-model.md docs/testing.md docs/verification/v12.2.md | sort)"
          test "$changed" = "$expected"
      - name: Commit package-external evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/security-model.md docs/testing.md docs/verification/v12.2.md
          git commit -m "docs: bind final Engine transition evidence"
          git push origin HEAD:agent/restore-activation-recall
