name: v12-scheduler-core-migration

on:
  push:
    branches: [feat/v12-scheduler-core]

permissions:
  contents: write

concurrency:
  group: v12-scheduler-core-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-scheduler-core
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact SchedulerCore migration
        run: python tools/v12_scheduler_core_migrate_wrapper.py
      - name: Verify migrated tree before commit
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit SchedulerCore migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/worker.js tests/worker-contract.mjs tests/worker-profile-governance.mjs tests/worker-restart.mjs tests/worker-scheduler.mjs tests/static-contract.mjs
          git commit -m "refactor: migrate Worker scheduling to pure SchedulerCore"
          git push origin HEAD:feat/v12-scheduler-core
