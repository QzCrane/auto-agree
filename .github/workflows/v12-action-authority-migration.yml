name: v12-action-authority-migration

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'migration/v12-action-authority' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == 'b444638368c82a00c6499be1c7033a70dd99f3a0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration/v12-action-authority
          fetch-depth: 0

      - name: Verify exact migration transaction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BASE" = "b444638368c82a00c6499be1c7033a70dd99f3a0"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test -f tools/v12_action_authority_migrate.py
          test -f .github/workflows/v12-action-authority-migration.yml
          test -f extension/action-authority.js
          test -f tests/action-authority.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Apply exact ActionAuthority migration
        run: python tools/v12_action_authority_migrate.py

      - name: Verify migrated product tree
        run: |
          set -euo pipefail
          npm test
          python tools/package_extension.py --check
          git diff --check
          test -f extension/action-authority.js
          ! grep -q 'function authorizeHandoverClick' extension/engine.js
          ! grep -q 'target.click()' extension/engine.js
          grep -q 'ACTION.attemptClick(target)' extension/engine.js
          grep -q "'action-authority.js'" extension/worker.js

      - name: Remove migration transport and commit product-only result
        run: |
          set -euo pipefail
          rm .github/workflows/v12-action-authority-migration.yml tools/v12_action_authority_migrate.py
          test ! -e .github/workflows/v12-action-authority-migration.yml
          test ! -e tools/v12_action_authority_migrate.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: centralize automated click authority'
          git push origin HEAD:migration/v12-action-authority
