name: Bootstrap v8 candidate

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-lifecycle-e2e-hardening
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8/v8.patch.05; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify v8 delta
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-v8/v8.patch.* | base64 --decode > /tmp/v8.patch.xz
          echo '05716b3bb6b857703f4028be13b17432839bbf50f3de978641a185b2cf0e4dfb  /tmp/v8.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/v8.patch.xz > /tmp/v8.patch
          git apply --check /tmp/v8.patch
          git apply /tmp/v8.patch
          rm -rf .bootstrap-v8

      - name: Verify v8 candidate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python tools/package_extension.py --check
          test "$(node -p "require('./extension/manifest.json').version")" = '8.0.0'
          git diff --check

      - name: Commit verified v8 candidate
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'feat: harden v8 worker lifecycle and real extension E2E'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"

      - name: Delete merged v7 feature branch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git push origin --delete feat/v7-repository-convergence || true
