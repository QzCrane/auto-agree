name: v12-runtime-kernel-migration

on:
  push:
    branches: [feat/v12-runtime-kernel]

permissions:
  contents: write

concurrency:
  group: v12-runtime-kernel-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-runtime-kernel
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact runtime-kernel migration
        run: |
          python tools/v12_runtime_kernel_migrate.py
          python tools/v12_runtime_kernel_harness_migrate.py
      - name: Verify migrated tree before commit
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit exact runtime-kernel migration
        run: |
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension tests package.json
          git commit -m "refactor: centralize runtime generation and bounded FIFO recovery"
          git push origin HEAD:feat/v12-runtime-kernel
