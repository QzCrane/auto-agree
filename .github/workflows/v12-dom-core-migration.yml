name: v12-dom-core-migration

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'migration/v12-dom-core' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '1af5396d93c20b03891a92ae69d13ced2fb8bdaa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration/v12-dom-core
          fetch-depth: 0

      - name: Verify exact migration transaction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BASE" = "1af5396d93c20b03891a92ae69d13ced2fb8bdaa"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test -f tools/v12_dom_core_migrate.py
          test -f .github/workflows/v12-dom-core-migration.yml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked development dependencies
        run: npm ci

      - name: Apply exact DomCore migration
        run: python tools/v12_dom_core_migrate.py

      - name: Verify migrated product tree
        run: |
          set -euo pipefail
          npm test
          python tools/package_extension.py --check
          git diff --check
          test -f extension/dom-core.js
          test -f tests/dom-core.mjs
          ! grep -q 'function composedParent' extension/engine.js
          ! grep -q 'function rootQueryById' extension/engine.js
          ! grep -q 'function composedParent' extension/handover-guard.js
          ! grep -q 'function rootQueryById' extension/handover-guard.js

      - name: Remove migration transport and commit product-only result
        run: |
          set -euo pipefail
          rm .github/workflows/v12-dom-core-migration.yml tools/v12_dom_core_migrate.py
          test ! -e .github/workflows/v12-dom-core-migration.yml
          test ! -e tools/v12_dom_core_migrate.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: centralize DOM topology primitives'
          git push origin HEAD:migration/v12-dom-core
