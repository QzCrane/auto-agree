name: Bootstrap v8 Xvfb E2E hardening

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-xvfb-e2e
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8-xvfb/e2e-xvfb.patch.b64; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply and verify Xvfb E2E hardening
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-v8-xvfb/e2e-xvfb.patch.b64 > /tmp/e2e-xvfb.patch
          echo 'd9e825da3920e4e3a50a141ad2cd1178b5beedafdd257abb23bc5c1710610fd0  /tmp/e2e-xvfb.patch' | sha256sum --check --strict
          git apply --check /tmp/e2e-xvfb.patch
          git apply /tmp/e2e-xvfb.patch
          rm -rf .bootstrap-v8-xvfb
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified E2E hardening
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'test: run unpacked Chrome E2E headed under Xvfb'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
