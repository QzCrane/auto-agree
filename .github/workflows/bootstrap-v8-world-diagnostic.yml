name: Bootstrap v8 isolated-world diagnostic

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Add isolated-world evidence to classless failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e-extension.mjs')
          s=p.read_text()
          imp="import {extensionWorldSentinels} from './e2e-isolated-worlds.mjs';\n"
          if imp not in s:
              anchor="import puppeteer from 'puppeteer';\n"
              if s.count(anchor)!=1: raise SystemExit('import anchor mismatch')
              s=s.replace(anchor,anchor+imp,1)
          old="    console.error('classless-diagnostic:',JSON.stringify({diag,manual}));"
          new="    const worlds=await extensionWorldSentinels(page);\n    console.error('classless-diagnostic:',JSON.stringify({diag,worlds,manual}));"
          if s.count(old)!=1: raise SystemExit(f'diagnostic anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/e2e-extension.mjs
          node --check tests/e2e-isolated-worlds.mjs
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit diagnostic harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e-extension.mjs tests/e2e-isolated-worlds.mjs
          git commit -m 'test: expose extension isolated-world state on failure'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
