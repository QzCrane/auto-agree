name: repair-engine-state-observer

on:
  push:
    branches: [agent/restore-activation-recall]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-activation-recall
      - name: Add document-wide candidate state attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('extension/engine.js')
          text = path.read_text(encoding='utf-8')
          old = "attributeFilter: ['type','role','title','name','placeholder','autocomplete','hidden','class','style','aria-hidden','aria-label','aria-labelledby','aria-describedby']"
          new = "attributeFilter: ['type','role','title','name','placeholder','autocomplete','checked','required','disabled','hidden','class','style','aria-checked','aria-required','aria-disabled','aria-hidden','aria-label','aria-labelledby','aria-describedby','data-state','data-checked']"
          assert text.count(old) == 1, f'expected exactly one discovery-observer attribute filter, found {text.count(old)}'
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "extension/engine.js"
          git diff --check
      - name: Commit exact repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/engine.js
          git commit -m "fix: observe live candidate state transitions"
          git push origin HEAD:agent/restore-activation-recall
