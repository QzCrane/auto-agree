name: v9-handover

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply handover firewall patch
        run: python .v9-handover.py
      - name: Repair generated static assertion order
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/static-contract.mjs')
          text=path.read_text(encoding='utf-8')
          misplaced="assert.match(engine,/authorizeHandoverClick/);\n"
          if text.count(misplaced)!=1:
              raise SystemExit(f'unexpected handover assertion count={text.count(misplaced)}')
          text=text.replace(misplaced,'',1)
          anchor="const engine=fs.readFileSync(path.join(root,'engine.js'),'utf8');\n"
          if text.count(anchor)!=1:
              raise SystemExit('engine declaration anchor missing')
          text=text.replace(anchor,anchor+misplaced,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Remove transport payload
        run: rm .v9-handover.py
      - name: Verify deterministic core
        run: npm test
      - name: Verify deterministic package
        run: python tools/package_extension.py --check
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: firewall stale update-generation clicks"
          git push origin HEAD:agent/v9-invariant-hardening
