name: v9-handover

on:
  push:
    branches: [agent/v9-invariant-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/v9-invariant-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply handover firewall patch
        run: python .v9-handover.py
      - name: Remove transport payload
        run: rm .v9-handover.py
      - name: Verify deterministic core
        run: npm test
      - name: Verify deterministic package
        run: python tools/package_extension.py --check
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: firewall stale update-generation clicks"
          git push origin HEAD:agent/v9-invariant-hardening
