name: v12-lifecycle-probe-migration

on:
  push:
    branches: [feat/v12-lifecycle-probe]

permissions:
  contents: write

concurrency:
  group: v12-lifecycle-probe-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-lifecycle-probe
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact Probe lifecycle migration
        run: python tools/v12_lifecycle_probe_migrate.py
      - name: Verify migrated tree before commit
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit Probe lifecycle migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/bootstrap.js tests/static-lifecycle.mjs package.json
          git commit -m "refactor: migrate Probe lifecycle state to shared kernel"
          git push origin HEAD:feat/v12-lifecycle-probe
