name: Apply v8 E2E cleanup

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-v8-e2e-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply deterministic cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e-extension.mjs')
          s = p.read_text()
          assert "import os from 'node:os';\n" in s
          assert "import {execFileSync} from 'node:child_process';\n" in s
          assert "const PREVIOUS_REF=process.env.AUTO_AGREE_PREVIOUS_REF || '';\n" in s
          s = s.replace("import os from 'node:os';\n", '', 1)
          s = s.replace("import {execFileSync} from 'node:child_process';\n", '', 1)
          s = s.replace("const PREVIOUS_REF=process.env.AUTO_AGREE_PREVIOUS_REF || '';\n", '', 1)

          start = s.index('function stagePrevious(')
          end = s.index('async function poll(', start)
          s = s[:start] + s[end:]

          old = "assert.ok(latency<4000,`5000-checkbox E2E latency ${latency.toFixed(1)}ms exceeded 4000ms regression ceiling`);"
          new = "assert.ok(latency<1000,`5000-checkbox E2E latency ${latency.toFixed(1)}ms exceeded 1000ms regression ceiling`);\n  assert.ok(result.taskDuration<0.8,`5000-checkbox TaskDuration ${result.taskDuration}s exceeded 0.8s regression ceiling`);"
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('async function updateTransition(')
          end = s.index('await withServer(', start)
          s = s[:start] + s[end:]
          assert '  await updateTransition(base);\n' in s
          s = s.replace('  await updateTransition(base);\n', '', 1)

          assert 'updateTransition(' not in s
          assert 'stagePrevious(' not in s
          assert 'latency<4000' not in s
          assert 'latency<1000' in s
          assert 'result.taskDuration<0.8' in s
          p.write_text(s)
          PY
          node --check tests/e2e-extension.mjs
          npm test
          python tools/package_extension.py --check
      - name: Commit cleanup only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e-extension.mjs
          git diff --cached --check
          git commit -m 'test: tighten E2E performance gate and remove duplicate update path'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
