name: cleanup-diff

on:
  push:
    branches: [agent/restore-activation-recall]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-activation-recall
      - name: Restore untouched historical wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Replaced the fragile manual deterministic-test command with **auto-discovery**. Audit proved `tests/classless-decision.mjs` existed but was omitted from the old manual `npm test` chain; v12 now auto-registers 27 deterministic gates and recovers that 6,000-case classless DecisionKernel property proof.'
          new = '- Replaced the fragile manual deterministic-test command with **auto-discovery**. Audit proved `tests/classless-decision.mjs` existed but was not previously executed by `npm test`; v12 now auto-registers 27 deterministic gates and recovers that 6,000-case classless DecisionKernel property proof.'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = "CHANGELOG.md"
      - name: Commit exact cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: preserve historical changelog wording"
          git push origin HEAD:agent/restore-activation-recall
