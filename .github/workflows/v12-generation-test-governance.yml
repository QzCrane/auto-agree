name: v12-generation-test-governance

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'migration/v12-generation-test-governance' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact governance transaction
        env:
          EXPECTED_BASE: 51ff072ab2cd5e0694815791060a5910edbc28c7
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$EVENT_BASE" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked development dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact generation-test repair
        run: node tools/v12_generation_test_governance.mjs
      - name: Verify repaired product tree
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "tests/runtime-kernel.mjs tests/version-contract.mjs "
      - name: Remove migration transport and commit product-only result
        run: |
          rm .github/workflows/v12-generation-test-governance.yml tools/v12_generation_test_governance.mjs
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/v12-generation-test-governance.yml tests/runtime-kernel.mjs tests/version-contract.mjs tools/v12_generation_test_governance.mjs "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: derive RuntimeKernel generation from manifest"
          test "$(git diff --name-only 51ff072ab2cd5e0694815791060a5910edbc28c7..HEAD | sort | tr '\n' ' ')" = "tests/runtime-kernel.mjs tests/version-contract.mjs "
          git push origin HEAD:migration/v12-generation-test-governance
