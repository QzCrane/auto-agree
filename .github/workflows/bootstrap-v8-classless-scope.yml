name: Bootstrap v8 classless scope formatting

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-classless-scope
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Normalize scope-recomposition indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/gate.js')
          s = p.read_text()
          start = s.index('          const node = nodes[i];')
          end = s.index('\n        }\n      } else if (record.type === \'characterData\') {', start)
          block = s[start:end]
          lines = block.splitlines()
          fixed = [lines[0]] + [('          ' + line if line and not line.startswith('          ') else line) for line in lines[1:]]
          out = s[:start] + '\n'.join(fixed) + s[end:]
          p.write_text(out)
          PY
          node --check extension/gate.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/gate.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: normalize classless scope recomposition block'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
