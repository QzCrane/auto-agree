name: Bootstrap v8 classless scope recomposition

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-classless-scope
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact local-scope mutation transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extension/gate.js')
          s = p.read_text()
          old = '''  function onMutations(records) {
            if (requested || paused) return;
            const start = performance.now();
            for (const record of records) {
              if (record.type === 'childList') {
                const nodes = record.addedNodes;
                if (nodes.length > LARGE_BATCH) {
                  const hit = sampleLargeBatch(nodes);
                  if (hit) return activate(`mutation-sample-${hit.reason || 'evidence'}`, hit.seed);
                  queueBatch(nodes, 0, record.target);
                  continue;
                }
                for (let i = 0; i < nodes.length; i++) {
                  if (performance.now() - start >= SYNC_MUTATION_BUDGET_MS) { queueBatch(nodes, i, record.target); break; }
                  const hit = inspectNode(nodes[i], true, Math.min(0.35, Math.max(0.12, SYNC_MUTATION_BUDGET_MS - (performance.now() - start))));
                  if (hit) return activate(`mutation-${hit.reason || 'evidence'}`, hit.seed || nodes[i]);
                }
              } else if (record.type === 'characterData') {
          '''
          new = '''  function onMutations(records) {
            if (requested || paused) return;
            const start = performance.now();
            const rescannedScopes = new WeakSet();
            for (const record of records) {
              if (record.type === 'childList') {
                const nodes = record.addedNodes;
                if (nodes.length > LARGE_BATCH) {
                  const hit = sampleLargeBatch(nodes);
                  if (hit) return activate(`mutation-sample-${hit.reason || 'evidence'}`, hit.seed);
                  queueBatch(nodes, 0, record.target);
                  continue;
                }
                for (let i = 0; i < nodes.length; i++) {
                  if (performance.now() - start >= SYNC_MUTATION_BUDGET_MS) { queueBatch(nodes, i, record.target); break; }
                  const node = nodes[i];
                  const remaining = Math.min(0.35, Math.max(0.12, SYNC_MUTATION_BUDGET_MS - (performance.now() - start)));
                  const hit = inspectNode(node, true, remaining);
                  if (hit) return activate(`mutation-${hit.reason || 'evidence'}`, hit.seed || node);

                  // Parser/framework commits often add credentials, a classless legal row, and the proceed
                  // action as sibling subtrees. No individual subtree then contains enough evidence even
                  // though their common form/dialog does. Recompose only the affected local UI scope once
                  // per MutationObserver delivery; never fall back to a document-wide rescan.
                  const el = node instanceof Element ? node : node?.parentElement;
                  if (!(el instanceof Element)) continue;
                  const nf = node.nodeType === Node.TEXT_NODE ? textFlags(node.data || '') : elementFlags(el);
                  if (!(nf & (F.AUTH | F.CREDENTIAL | F.LEGAL | F.ASSENT | F.REQUIRED))) continue;
                  const scope = localScope(el);
                  if (!(scope instanceof Element) || scope === el || rescannedScopes.has(scope)) continue;
                  rescannedScopes.add(scope);
                  const local = scanEvidence(scope, 112, Math.min(0.65, Math.max(0.18, SYNC_MUTATION_BUDGET_MS - (performance.now() - start))), true);
                  if (local.hit) return activate(`mutation-scope-${local.reason || 'evidence'}`, local.seed || scope);
                  if (local.truncated) queueDeep(scope, true);
                }
              } else if (record.type === 'characterData') {
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one gate mutation block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          node --check extension/gate.js
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension/gate.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: recompose classless consent evidence at local scope'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
