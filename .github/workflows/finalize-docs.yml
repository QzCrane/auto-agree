name: finalize-docs

on:
  push:
    branches: [agent/restore-activation-recall]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-activation-recall
          fetch-depth: 0
      - name: Synchronize final package identity and activation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          old_hash = '0f0d4b5e2991546e2c0217a04b692d9e1141f4c734afaa55390a82db7be264dd'
          new_hash = '1478d808e277f6c687f719bc7185ff1398b4f6199450f988eda4b03ad3d4b601'
          hash_files = [
              Path('README.md'),
              Path('docs/testing.md'),
              Path('docs/security-model.md'),
              Path('docs/verification/v12.2.md'),
          ]
          for path in hash_files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old_hash)
              assert count == 1, f'{path}: expected one old package hash, got {count}'
              path.write_text(text.replace(old_hash, new_hash), encoding='utf-8')

          replacements = {
              Path('README.md'): [(
                  '- **Probe** is always present but never decides consent. v12.2 gives its activation boundary an independent real-Chrome contract: explicit deep native-label/ARIA relations and bounded proceed intent can escalate richer analysis, while generic deep geometry remains narrow.',
                  '- **Probe** is always present but never decides consent. v12.2 gives its activation boundary an independent real-Chrome contract: explicit deep native-label/ARIA relations can escalate richer analysis; a trusted proceed-like interaction can widen only local inspection when the bounded region co-locates access/auth semantics + legal semantics + a consent control. Generic deep geometry and Continue alone remain insufficient.'
              )],
              Path('docs/testing.md'): [(
                  '4. a custom non-form/non-dialog access shell after a trusted proceed-like `Continue` interaction.',
                  '4. a custom non-form/non-dialog access shell after a trusted `Continue` interaction where the bounded ancestor region co-locates access/auth semantics + legal semantics + a consent control.'
              ),(
                  'The negative case contains geometrically remote Terms text and a semantically neutral required `#generic-box` with no label/ARIA relation and no proceed interaction; it must remain `checked=false`.',
                  'Two negative cases are permanent: geometrically remote Terms text plus a semantically neutral required `#generic-box` with no label/ARIA relation must not even activate Gate; and Terms + required checkbox + trusted `Continue` still must not activate Gate or click when the bounded region lacks access/auth semantics.'
              ),(
                  '- proceed-intent ancestry: at most 6 ancestors;',
                  '- proceed-intent ancestry: at most 6 ancestors, and activation requires access/auth + legal + consent-control co-occurrence in the bounded region;'
              )],
              Path('docs/verification/v12.2.md'): [(
                  '4. A real proceed-like interaction (`login`, `continue`, `next`, `submit`, `verify`, and supported Chinese equivalents) may search a bounded six-ancestor region with fixed node/time budgets.',
                  '4. A trusted proceed-like interaction (`login`, `continue`, `next`, `submit`, `verify`, and supported Chinese equivalents) may inspect at most six ancestors with fixed node/time budgets, but it can activate Gate only when that bounded region co-locates access/auth semantics + legal semantics + a consent control.'
              ),(
                  '- a custom non-form/non-dialog access shell that becomes locally searchable only after a trusted `Continue` interaction.',
                  '- a custom non-form/non-dialog access shell that becomes locally searchable only after a trusted `Continue` interaction and bounded access/auth + legal + control co-occurrence.'
              ),(
                  '- geometrically remote Terms text plus a semantically neutral required checkbox, with no native-label/ARIA relation and no proceed interaction, must remain `checked=false`.',
                  '- geometrically remote Terms text plus a semantically neutral required checkbox, with no native-label/ARIA relation, must remain `checked=false` and must not activate Gate;\n- Terms + required checkbox + trusted `Continue`, but no access/auth semantics in the bounded proceed region, must likewise remain `checked=false` and must not activate Gate.'
              )],
              Path('CHANGELOG.md'): [(
                  '- Restored bounded activation recall for deep native-label relationships, long legal text through the existing head/center/tail sampler, SPA-style late `aria-labelledby`/`aria-describedby` bindings, and explicit proceed interactions in custom non-form containers.',
                  '- Restored bounded activation recall for deep native-label relationships, long legal text through the existing head/center/tail sampler, SPA-style late `aria-labelledby`/`aria-describedby` bindings, and trusted proceed interactions only when the bounded region co-locates access/auth + legal + consent-control evidence.'
              )],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  assert count == 1, f'{path}: expected one replacement target, got {count}: {old[:80]}'
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit only package-external documentation
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' CHANGELOG.md README.md docs/security-model.md docs/testing.md docs/verification/v12.2.md | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md docs/security-model.md docs/testing.md docs/verification/v12.2.md
          git commit -m "docs: bind final 12.2.0 evidence"
          git push origin HEAD:agent/restore-activation-recall
