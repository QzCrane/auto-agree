name: v12-lifecycle-gate-migration

on:
  push:
    branches: [feat/v12-lifecycle-gate]

permissions:
  contents: write

concurrency:
  group: v12-lifecycle-gate-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-lifecycle-gate
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact Gate lifecycle migration
        run: python tools/v12_lifecycle_gate_migrate.py
      - name: Verify migrated tree before commit
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit Gate lifecycle migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/gate.js tests/static-lifecycle.mjs
          git commit -m "refactor: migrate Gate lifecycle to shared kernel"
          git push origin HEAD:feat/v12-lifecycle-gate
