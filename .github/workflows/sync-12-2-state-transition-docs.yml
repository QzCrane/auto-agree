name: sync-12-2-state-transition-docs

on:
  push:
    branches: [agent/restore-activation-recall]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-activation-recall
      - name: Record Engine state-transition repair without touching package bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            'CHANGELOG.md': [(
              '- Added `e2e-activation-recall.mjs` to hosted unpacked-Chrome CI and the executable exact-head closeout policy, increasing formal closeout from 19 to 20 lanes while keeping two same-head attempts.\n',
              '- Added `e2e-activation-recall.mjs` to hosted unpacked-Chrome CI and the executable exact-head closeout policy, increasing formal closeout from 19 to 20 lanes while keeping two same-head attempts.\n- Fixed a second real-browser false negative exposed only after activation was isolated: document/Shadow-wide Engine discovery did not observe `checked`/`required`/`disabled`/ARIA/data state changes, so an indexed candidate that became actionable later could remain permanently stale. The discovery observer now watches the same candidate-state attributes used by snapshot/relevance logic, with a dedicated auto-registered contract.\n'
            )],
            'docs/testing.md': [(
              'This restores recall without granting generic deep geometry a new path to consent authority. Gate, DecisionKernel, Risk Core, Engine, Handover Guard and ActionAuthority remain unchanged by v12.2.\n',
              'This restores recall without granting generic deep geometry a new path to consent authority. Gate, DecisionKernel, Risk Core, Handover Guard and ActionAuthority remain unchanged by this part of v12.2; Engine receives only the state-observer repair described below, not a policy change.\n\n### Engine live candidate state transitions\n\nThe stricter activation test deliberately begins positive controls disabled so Gate/Engine reachability is observable separately from action. That exposed a second defect: document/Shadow-wide `discoveryObserver` did not subscribe to candidate-state attributes even though `mutationAttributeRelevant()` and CandidateSnapshot already understood them. A disabled candidate could therefore be indexed and rejected correctly, then never re-evaluated after becoming enabled unless it happened to live under a separately registered form/dialog context.\n\nv12.2 aligns the document/Shadow observer with the existing state model by observing `checked`, `required`, `disabled`, `aria-checked`, `aria-required`, `aria-disabled`, `data-state`, and `data-checked`. `tests/engine-state-transition-contract.mjs` locks that attribute set and proves candidate indexing precedes decision rejection, while `e2e-activation-recall.mjs` physically requires `disabled=true → disabled=false → checked=true` on the real unpacked extension. No DecisionKernel acceptance rule or ActionAuthority path changes.\n'
            )],
            'docs/security-model.md': [(
              'This repair does not modify Gate, DecisionKernel, Risk Core, Engine, Handover Guard or ActionAuthority. More Probe recall can therefore load richer analysis, but it cannot by itself mint automated-action authority.\n',
              'The Probe repair does not modify Gate, DecisionKernel, Risk Core, Handover Guard or ActionAuthority. More Probe recall can therefore load richer analysis, but it cannot by itself mint automated-action authority. v12.2 separately fixes Engine observation of already-indexed controls whose live checked/required/disabled/ARIA/data state changes; that repair only makes the existing snapshot/policy path run again and does not add a new acceptance or click-authority rule.\n'
            )],
            'docs/verification/v12.2.md': [(
              'The problem was therefore not that DecisionKernel, Engine, or ActionAuthority had lost the ability to accept a routine agreement. The richer runtime could simply fail to start.\n',
              'The first problem was therefore not that DecisionKernel or ActionAuthority had lost the ability to accept a routine agreement. The richer runtime could simply fail to start.\n\nAfter the activation discriminator was hardened to prove Gate/Engine reachability independently from action, it exposed a second defect: an Engine candidate discovered while `disabled=true` was indexed before policy rejection, but document/Shadow-wide discovery did not observe the later `disabled=false` state change. Form/dialog contexts had a richer observer, so this failure depended on topology and could evade the earlier corpus.\n'
            ),(
              'Gate, DecisionKernel, Risk Core, Engine, Handover Guard, and ActionAuthority are unchanged by this repair.\n',
              'Gate, DecisionKernel, Risk Core, Handover Guard, and ActionAuthority are unchanged by the activation repair. Engine receives one orthogonal state-observation correction: its document/Shadow discovery observer now watches `checked`, `required`, `disabled`, `aria-checked`, `aria-required`, `aria-disabled`, `data-state`, and `data-checked`, matching the state attributes already consumed by mutation relevance and CandidateSnapshot. No Engine decision formula is widened.\n'
            ),(
              'Every positive case requires the actual agreement control to become `checked=true` and requires both Gate and Engine to have been reached.\n',
              'Every positive case starts with the target disabled, first requires current Gate+Engine to be observable while `checked=false`, then changes the live target to enabled and requires the actual agreement control to become `checked=true`. This separates activation proof from downstream state-transition/action proof.\n'
            )],
          }

          for filename, replacements in changes.items():
              p=Path(filename); text=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  assert text.count(old)==1, (filename, old[:80], text.count(old))
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' CHANGELOG.md docs/security-model.md docs/testing.md docs/verification/v12.2.md | sort)"
          test "$changed" = "$expected"
      - name: Commit package-external release record
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs/security-model.md docs/testing.md docs/verification/v12.2.md
          git commit -m "docs: record Engine live-state transition repair"
          git push origin HEAD:agent/restore-activation-recall
