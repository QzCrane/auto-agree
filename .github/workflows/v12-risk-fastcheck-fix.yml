name: v12-risk-fastcheck-fix

on:
  push:
    branches: [feat/v12-architecture-convergence]

permissions:
  contents: write

concurrency:
  group: v12-risk-fastcheck-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-architecture-convergence
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Add exact automatic-renewal risk companions
        run: |
          python - <<'PY'
          from pathlib import Path

          risk = Path('extension/risk-core.js')
          text = risk.read_text()
          old = 'auto.?renew|subscription\\s+plan|arbitration'
          new = 'auto.?renew(?:al)?|automatic\\s+renewal|subscription\\s+plan|arbitration'
          if text.count(old) != 1:
              raise SystemExit(f'expected one consequential renewal pattern, got {text.count(old)}')
          text = text.replace(old, new)

          old = 'powerofattorney|autorenew|subscriptionplan'
          new = 'powerofattorney|autorenew(?:al)?|automaticrenewal|subscriptionplan'
          if text.count(old) != 1:
              raise SystemExit(f'expected one compact consequential renewal pattern, got {text.count(old)}')
          text = text.replace(old, new)

          old = 'promotion|autorenew|subscription|captcha'
          new = 'promotion|autorenew(?:al)?|automaticrenewal|subscription|captcha'
          if text.count(old) != 1:
              raise SystemExit(f'expected one compact negative renewal pattern, got {text.count(old)}')
          text = text.replace(old, new)
          risk.write_text(text)

          prop = Path('tests/property-consent-model.mjs')
          text = prop.read_text()
          old = "  'medical informed consent'\n];"
          new = "  'medical informed consent',\n  'accept automatic renewal'\n];"
          if text.count(old) != 1:
              raise SystemExit('fixed consequential corpus insertion anchor changed')
          prop.write_text(text.replace(old, new))
          PY

          npm test
          python tools/package_extension.py --check
      - name: Commit production fix and fixed regression
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/risk-core.js tests/property-consent-model.mjs
          git commit -m "fix: classify automatic renewal as consequential consent"
          git push origin HEAD:feat/v12-architecture-convergence
