name: Bootstrap v8 extension-registration wait

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-registration-wait
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply exact bounded registration wait
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e-extension.mjs')
          s = p.read_text()
          old = """async function autoAgreeExtension(browser){
            const extensions=await browser.extensions();
            for(const ext of extensions.values()) if(ext.name==='Auto Agree Login Terms') return ext;
            const installed=[...extensions.values()].map(ext=>({id:ext.id,name:ext.name,version:ext.version}));
            const workers=browser.targets().filter(t=>t.type()==='service_worker').map(t=>t.url());
            console.error('extension-diagnostic:',JSON.stringify({installed,workers,headed:HEADED}));
            throw new Error('Auto Agree extension not installed');
          }
          """
          new = """async function autoAgreeExtension(browser,timeout=5000){
            const deadline=Date.now()+timeout;
            let extensions=new Map();
            while(Date.now()<deadline){
              extensions=await browser.extensions();
              for(const ext of extensions.values()) if(ext.name==='Auto Agree Login Terms') return ext;
              await new Promise(resolve=>setTimeout(resolve,50));
            }
            const installed=[...extensions.values()].map(ext=>({id:ext.id,name:ext.name,version:ext.version}));
            const workers=browser.targets().filter(t=>t.type()==='service_worker').map(t=>t.url());
            console.error('extension-diagnostic:',JSON.stringify({installed,workers,headed:HEADED,timeout}));
            throw new Error('Auto Agree extension not installed after bounded registration wait');
          }
          """
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one registration block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          rm -rf .bootstrap-v8-registration
          node --check tests/e2e-extension.mjs
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified registration wait
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: wait for unpacked extension registration'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
