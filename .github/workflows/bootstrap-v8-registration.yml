name: Bootstrap v8 extension-registration wait

on:
  push:
    branches: [feat/v8-lifecycle-e2e-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bootstrap-v8-registration-wait
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - id: payload
        shell: bash
        run: |
          if test -f .bootstrap-v8-registration/registration-wait.patch.b64; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Apply and verify bounded registration wait
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-v8-registration/registration-wait.patch.b64 > /tmp/registration.patch
          echo '10f6f6434ef172327b94aac3d4de3877e22fcd0d2c5ac7aa97deb06dd4dc2cbd  /tmp/registration.patch' | sha256sum --check --strict
          git apply --check /tmp/registration.patch
          git apply /tmp/registration.patch
          rm -rf .bootstrap-v8-registration
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit verified registration wait
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'test: wait for unpacked extension registration'
          target="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target}"
