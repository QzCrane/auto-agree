name: v12-type-boundary-migration

on:
  push:
    branches: [feat/v12-architecture-convergence]

permissions:
  contents: write

concurrency:
  group: v12-type-boundary-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-architecture-convergence
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact typed-JS boundary edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), got {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          # bootstrap: getRootNode() is a Node by Web IDL; only query Document/DocumentFragment roots.
          replace_exact(
              'extension/bootstrap.js',
              """    const root = el.getRootNode?.() || document;\n    const parts = [];\n    for (const id of ids) {\n      let ref = null;\n      try { ref = root.getElementById?.(id) || root.querySelector?.(`#${CSS.escape(id)}`); } catch (_) {}\n""",
              """    const root = el.getRootNode();\n    const parts = [];\n    for (const id of ids) {\n      let ref = null;\n      try {\n        if (root instanceof Document) ref = root.getElementById(id);\n        else if (root instanceof DocumentFragment) ref = root.querySelector(`#${CSS.escape(id)}`);\n      } catch (_) {}\n"""
          )
          replace_exact(
              'extension/bootstrap.js',
              """        const root = p.getRootNode?.() || document;\n        let target = null;\n        try { target = root.getElementById?.(id) || root.querySelector?.(`#${CSS.escape(id)}`); } catch (_) {}\n""",
              """        const root = p.getRootNode();\n        let target = null;\n        try {\n          if (root instanceof Document) target = root.getElementById(id);\n          else if (root instanceof DocumentFragment) target = root.querySelector(`#${CSS.escape(id)}`);\n        } catch (_) {}\n"""
          )

          # engine: narrow text nodes and query roots explicitly; hidden is an Element attribute contract.
          replace_exact(
              'extension/engine.js',
              """      if (node.nodeType === Node.TEXT_NODE) {\n        pushPart(parts, node.data, budget);\n""",
              """      if (node instanceof Text) {\n        pushPart(parts, node.data, budget);\n"""
          )
          replace_exact(
              'extension/engine.js',
              """    const root = el.getRootNode?.() || document;\n    try {\n      if (root instanceof Document) return root.getElementById(id);\n      return root.querySelector?.(`#${CSS.escape(id)}`) || null;\n""",
              """    const root = el.getRootNode();\n    try {\n      if (root instanceof Document) return root.getElementById(id);\n      if (root instanceof DocumentFragment) return root.querySelector(`#${CSS.escape(id)}`);\n      return null;\n"""
          )
          replace_exact(
              'extension/engine.js',
              """      const root = input.getRootNode?.() || document;\n      try {\n        const label = root.querySelector?.(`label[for=\"${CSS.escape(input.id)}\"]`);\n""",
              """      const root = input.getRootNode();\n      try {\n        if (!(root instanceof Document || root instanceof DocumentFragment)) return input.closest?.('label') || null;\n        const label = root.querySelector(`label[for=\"${CSS.escape(input.id)}\"]`);\n"""
          )
          replace_exact(
              'extension/engine.js',
              "if (p.hidden || p.getAttribute('aria-hidden') === 'true' || p.hasAttribute('inert')) return false;",
              "if (p.hasAttribute('hidden') || p.getAttribute('aria-hidden') === 'true' || p.hasAttribute('inert')) return false;"
          )
          replace_exact(
              'extension/engine.js',
              """    let root = document;\n    for (const selector of locator.hosts) {\n""",
              """    /** @type {Document | ShadowRoot} */\n    let root = document;\n    for (const selector of locator.hosts) {\n"""
          )

          # handover guard: same root-query boundary as Engine.
          replace_exact(
              'extension/handover-guard.js',
              """    const root = el.getRootNode?.() || document;\n    try {\n      if (root instanceof Document) return root.getElementById(id);\n      return root.querySelector?.(`#${CSS.escape(id)}`) || null;\n""",
              """    const root = el.getRootNode();\n    try {\n      if (root instanceof Document) return root.getElementById(id);\n      if (root instanceof DocumentFragment) return root.querySelector(`#${CSS.escape(id)}`);\n      return null;\n"""
          )

          # worker: the serializer chain carries the previous task result but callers do not depend on it.
          replace_exact(
              'extension/worker.js',
              "let storageWriteChain = Promise.resolve();",
              "/** @type {Promise<boolean | void>} */\nlet storageWriteChain = Promise.resolve();"
          )
          replace_exact(
              'extension/worker.js',
              """    const stored = await chrome.storage.session?.get(REHYDRATE_KEY);\n    if (stored?.[REHYDRATE_KEY]?.version === VERSION) await requestUpdateRehydrate();\n""",
              """    const stored = await chrome.storage.session?.get(REHYDRATE_KEY);\n    const resumeMarker = stored?.[REHYDRATE_KEY];\n    if (resumeMarker && typeof resumeMarker === 'object' && 'version' in resumeMarker && resumeMarker.version === VERSION) {\n      await requestUpdateRehydrate();\n    }\n"""
          )
          PY

          npm run typecheck
          npm test
          python tools/package_extension.py --check
      - name: Commit exact boundary changes
        run: |
          git status --short
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/bootstrap.js extension/engine.js extension/handover-guard.js extension/worker.js
          git commit -m "refactor: make browser and worker type boundaries explicit"
          git push origin HEAD:feat/v12-architecture-convergence
