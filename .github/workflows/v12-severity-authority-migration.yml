name: v12-severity-authority-migration

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'migration/v12-severity-authority' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.sha == '7d5dbf81db3bed6040ec2a52d264be8678429c82'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: migration/v12-severity-authority
          fetch-depth: 0

      - name: Verify exact migration transaction
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$EXPECTED_BASE" = "7d5dbf81db3bed6040ec2a52d264be8678429c82"
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test -f tools/v12_severity_authority_migrate.py

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply exact cleanup
        run: python tools/v12_severity_authority_migrate.py

      - name: Verify product tree
        run: |
          set -euo pipefail
          npm test
          python tools/package_extension.py --check
          git diff --check
          ! grep -q 'const SEVERITY = Object.freeze' extension/semantic-core.js
          grep -q 'const SEVERITY = Object.freeze' extension/decision-core.js

      - name: Remove transport and commit product-only result
        run: |
          set -euo pipefail
          rm .github/workflows/v12-severity-authority-migration.yml tools/v12_severity_authority_migrate.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: make DecisionKernel sole severity authority'
          git push origin HEAD:migration/v12-severity-authority
