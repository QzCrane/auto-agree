name: v12-profile-engine-migration

on:
  push:
    branches: [feat/v12-profile-core]

permissions:
  contents: write

concurrency:
  group: v12-profile-engine-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v12-profile-core
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts
      - name: Apply exact Engine ProfileCore migration
        run: python tools/v12_profile_engine_migrate.py
      - name: Verify migrated tree before commit
        run: |
          npm test
          python tools/package_extension.py --check
          git diff --check
      - name: Commit ProfileCore Engine migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add extension/engine.js extension/worker.js tests/static-contract.mjs tests/worker-contract.mjs tests/profile-core.mjs
          git commit -m "refactor: make Engine consume shared ProfileCore"
          git push origin HEAD:feat/v12-profile-core
