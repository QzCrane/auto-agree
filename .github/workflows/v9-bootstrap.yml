name: v9-bootstrap

on:
  push:
    branches: [agent/v9-invariant-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply v9 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.v9-bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old = "replace_once('tests/e2e-update.mjs', \"assert.equal(JSON.parse(fs.readFileSync(path.join(active,'manifest.json'),'utf8')).version,'8.0.0');\", \"assert.equal(JSON.parse(fs.readFileSync(path.join(active,'manifest.json'),'utf8')).version,'9.0.0');\")"
          new = "replace_once('tests/e2e-update.mjs', \"    replaceDir(CURRENT,active);\\n    assert.equal(JSON.parse(fs.readFileSync(path.join(active,'manifest.json'),'utf8')).version,'8.0.0');\", \"    replaceDir(CURRENT,active);\\n    assert.equal(JSON.parse(fs.readFileSync(path.join(active,'manifest.json'),'utf8')).version,'9.0.0');\")"
          if text.count(old) != 1:
              raise SystemExit(f'bootstrap hotfix anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .v9-bootstrap.py
      - name: Align restart fixture with sender-bound profile identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/worker-restart.mjs')
          text=path.read_text(encoding='utf-8')
          replacements=[
            ("vm.runInNewContext(source,{chrome,console,Promise,Map,Set,Date,Error,Number,String,Array,Object,JSON,Math,setTimeout,clearTimeout});","vm.runInNewContext(source,{chrome,console,Promise,Map,Set,Date,Error,Number,String,Array,Object,JSON,Math,URL,setTimeout,clearTimeout});"),
            ("sender={tab:{id:1},frameId:0,documentId:'d',documentLifecycle:'active'}","sender={tab:{id:1},frameId:0,documentId:'d',documentLifecycle:'active',origin:'https://example.test',url:'https://example.test/login'}"),
            ("version:'8.0.0'","version:'9.0.0'")
          ]
          for old,new in replacements:
            if old not in text: raise SystemExit(f'missing restart fixture anchor: {old}')
            text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Remove bootstrap payload
        run: rm .v9-bootstrap.py
      - name: Verify deterministic core
        run: npm test
      - name: Verify deterministic package
        run: python tools/package_extension.py --check
      - name: Commit canonical candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: recover AutoAgree v9 safety invariants"
          git push origin HEAD:agent/v9-invariant-hardening
