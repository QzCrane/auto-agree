name: v9-bootstrap

on:
  push:
    branches: [agent/v9-invariant-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply v9 patch
        run: python .v9-bootstrap.py
      - name: Remove bootstrap payload
        run: rm .v9-bootstrap.py
      - name: Verify deterministic core
        run: npm test
      - name: Verify deterministic package
        run: python tools/package_extension.py --check
      - name: Commit canonical candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: recover AutoAgree v9 safety invariants"
          git push origin HEAD:agent/v9-invariant-hardening
