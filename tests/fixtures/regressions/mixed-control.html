<!doctype html><meta charset="utf-8"><title>Mixed consent control must not toggle</title>
<form><input type="email" value="valid@example.com"><div id="agree" role="checkbox" aria-checked="mixed" aria-label="I agree to the Terms of Service" data-clicks="0"></div><button type="button">Login</button></form>
<script>document.querySelector('#agree').addEventListener('click',e=>{e.currentTarget.dataset.clicks=String(Number(e.currentTarget.dataset.clicks||0)+1);e.currentTarget.setAttribute('aria-checked','false');});</script>
