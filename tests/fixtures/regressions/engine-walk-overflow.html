<!doctype html>
<meta charset="utf-8">
<title>Engine walk overflow</title>
<form id="seed-form">
  <input type="email" value="user@example.com">
  <label><input id="seed-agree" type="checkbox" required>I have read and agree to the Terms of Service</label>
  <button>Login</button>
</form>
<div id="mount"></div>
<script>
  document.querySelector('#seed-agree').addEventListener('click', event => {
    event.currentTarget.dataset.clicks = String(Number(event.currentTarget.dataset.clicks || 0) + 1);
  });
</script>
