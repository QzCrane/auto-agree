<!doctype html><meta charset="utf-8"><title>Dynamic Login</title>
<div id="mount"></div>
<script>
window.dynamicClicks=0;
window.insertRoutineLogin=()=>{
  document.querySelector('#mount').innerHTML='<form><input type="email" value="user@example.com"><label><input id="dynamic-agree" type="checkbox" required>I agree to the Terms of Service and Privacy Policy</label><button>Continue</button></form>';
  window.dynamicClicks=0;
  document.querySelector('#dynamic-agree').addEventListener('click',()=>{window.dynamicClicks++;});
};
window.insertMixedLogin=()=>{
  document.querySelector('#mount').innerHTML='<form><input type="email" value="user@example.com"><div id="dynamic-mixed" role="checkbox" aria-checked="mixed" aria-label="I agree to the Terms of Service" data-clicks="0"></div><button type="button">Login</button></form>';
  window.dynamicClicks=0;
  document.querySelector('#dynamic-mixed').addEventListener('click',event=>{
    window.dynamicClicks++;
    event.currentTarget.dataset.clicks=String(Number(event.currentTarget.dataset.clicks||0)+1);
  });
};
window.insertUserDelegatedTerms=()=>{
  document.querySelector('#mount').innerHTML='<div id="delegated-wrapper" tabindex="0" style="display:inline-flex;gap:8px;align-items:center;padding:8px"><input id="delegated-input" type="checkbox">Terms of Service</div>';
  window.dynamicClicks=0;
  const wrapper=document.querySelector('#delegated-wrapper');
  const input=document.querySelector('#delegated-input');
  input.addEventListener('click',()=>{window.dynamicClicks++;});
  wrapper.addEventListener('click',event=>{
    if(event.target===wrapper) input.click();
  });
};
window.insertExternalIdrefUnknown=()=>{
  document.querySelector('#external-filler')?.remove();
  document.querySelector('#far-terms-label')?.remove();
  const filler=document.createElement('div');filler.id='external-filler';
  for(let i=0;i<72;i++){const span=document.createElement('span');span.textContent='neutral '+i;filler.append(span);}
  document.body.append(filler);
  const label=document.createElement('div');label.id='far-terms-label';label.textContent='I agree to the Terms of Service';document.body.append(label);
  // Current v10 Engine refuses mixed state, so any click observed here after the test explicitly
  // calls .click() inside the surviving v9 execution context is stale-generation authority only.
  document.querySelector('#mount').innerHTML='<form><input type="email" value="user@example.com"><div id="external-unknown" role="checkbox" aria-checked="mixed" aria-labelledby="far-terms-label" data-clicks="0"></div><button type="button">Login</button></form>';
  window.dynamicClicks=0;
  document.querySelector('#external-unknown').addEventListener('click',event=>{
    window.dynamicClicks++;
    event.currentTarget.dataset.clicks=String(Number(event.currentTarget.dataset.clicks||0)+1);
  });
};
window.insertWideCausalTrap=()=>{
  const spans=Array.from({length:72},(_,i)=>'<span>neutral '+i+'</span>').join('');
  document.querySelector('#mount').innerHTML='<div id="wide-causal"><button id="wide-action" type="button">Continue</button>'+spans+'<div id="wide-terms" role="checkbox" aria-checked="mixed" aria-label="Terms of Service" data-clicks="0"></div></div>';
  window.dynamicClicks=0;
  const terms=document.querySelector('#wide-terms');
  terms.addEventListener('click',event=>{window.dynamicClicks++;event.currentTarget.dataset.clicks=String(Number(event.currentTarget.dataset.clicks||0)+1);});
  document.querySelector('#wide-action').addEventListener('click',()=>terms.click());
};
window.clearRoutineLogin=()=>{document.querySelector('#mount').replaceChildren();document.querySelector('#external-filler')?.remove();document.querySelector('#far-terms-label')?.remove();window.dynamicClicks=0;};
</script>
